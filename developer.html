<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice Arsyatera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
/* ======================== GENERAL SETTING & NAVBAR ======================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: white; font-family: 'Montserrat', sans-serif; overflow-x: hidden; padding-top: 50px; }
        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }
        
        .navbar { background-color: #D0D0D0; display: flex; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .navbar-container { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo-navbar img { height: 45px; max-width: 100%; object-fit: contain; }
        .nav-links { display: flex; list-style: none; gap: 45px; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #5a0815; font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; transition: color 0.3s ease; }
        .nav-links a:hover { color: #A3162B; }
        @media (max-width: 768px) { .navbar-container { padding: 10px 25px; } .nav-links { gap: 20px; } .nav-links a { font-size: 15px; } }
        @media (max-width: 576px) { .navbar-container { flex-direction: column; gap: 15px; padding: 15px 20px; } body { padding-top: 110px; } }

/* ======================== ADVICE (CAROUSEL & CARD) ======================== */
        .advice-section { background: linear-gradient(135deg, #5a0815, #3a040d); width: 100%; min-height: calc(100vh - 65px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; flex-direction: column; }
        .advice-container { width: 100%; max-width: 900px; text-align: center; }
        .advice-title { color: white; font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700; letter-spacing: 2px; line-height: 1.1; margin-bottom: 15px; }
        .advice-subtitle { color: rgba(255, 255, 255, 0.9); font-size: 16px; margin-bottom: 50px; font-family: 'Montserrat', sans-serif; }
        .advice-carousel-wrapper { display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 10; }
        
        .nav-btn { background: transparent; border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; flex-shrink: 0; outline: none; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: white; transform: scale(1.1); }
        .nav-btn svg { width: 24px; height: 24px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .advice-flip-container { perspective: 1200px; width: 100%; max-width: 700px; z-index: 10; }
        .advice-card { background: white; border-radius: 15px; padding: 30px; text-align: left; box-shadow: 0 15px 40px rgba(0,0,0,0.3); margin: 0 auto; transform-style: preserve-3d; transition: transform 0.4s ease-in-out; width: 100%; }
        
        .advice-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .advice-user { display: flex; align-items: center; gap: 15px; }
        
        /* Modifikasi untuk Foto Profil */
        .advice-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #111; object-fit: cover; background-color: white; padding: 8px; /* Memberi jarak agar logo tidak nabrak garis */}

        /* Modifikasi untuk Nama dan Gelar */
        .advice-user-info { display: flex; flex-direction: column; }
        .advice-username { font-family: 'Montserrat', sans-serif; font-weight: 700; color: #111; font-size: 16px; }
        .advice-degree { font-family: 'Montserrat', sans-serif; font-weight: 500; color: #666; font-size: 13px; margin-top: 2px; }
        
        .advice-body p { font-family: 'Montserrat', sans-serif; font-size: 15px; color: #222; line-height: 1.6; margin-bottom: 10px; min-height: 60px; }
        
        /* Modifikasi untuk Waktu */
        .advice-time { font-family: 'Montserrat', sans-serif; font-size: 12px; color: #888; margin-bottom: 25px; display: block; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px;}
        
        .advice-actions { display: flex; gap: 20px; align-items: center; }
        
        .action-item { display: flex; align-items: center; gap: 5px; cursor: pointer; transition: transform 0.2s; }
        .action-item:hover { transform: scale(1.05); }
        .action-item:hover .icon-svg { stroke: #A3162B; }
        .action-count { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600; color: #555; transition: color 0.2s; }
        
        .icon-svg.liked { fill: #A3162B; stroke: #A3162B; }
        .action-count.liked { color: #A3162B; }
        .icon-svg { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; transition: stroke 0.2s, fill 0.2s; }
        .icon-svg:hover { stroke: #A3162B; }

        @media (max-width: 768px) { .advice-title { font-size: 36px; } .advice-card { padding: 25px; } .advice-carousel-wrapper { gap: 10px; } .nav-btn { width: 35px; height: 35px; } .nav-btn svg { width: 18px; height: 18px; } }

/* ======================== COMMENTS SECTION ======================== */
        /* (Tetap Sama Seperti Sebelumnya) */
        .comments-wrapper { width: 100%; max-width: 700px; margin: 20px auto 0; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: left; opacity: 1; transition: opacity 0.3s; }
        .yt-comments-count { font-size: 18px; font-weight: 700; color: #0f0f0f; margin-bottom: 25px; }
        .yt-comment-form { display: flex; gap: 15px; margin-bottom: 35px; }
        .yt-avatar-self { width: 40px; height: 40px; border-radius: 50%; background: #f2f2f2; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .yt-avatar-self svg { width: 22px; height: 22px; stroke: #606060; fill: none; stroke-width: 2; }
        .yt-form-right { flex-grow: 1; display: flex; flex-direction: column; }
        .yt-input { border: none; border-bottom: 1px solid #e5e5e5; padding: 5px 0; font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none; background: transparent; transition: border-color 0.2s; }
        .yt-input:focus { border-bottom: 2px solid #0f0f0f; }
        .yt-input-name { margin-bottom: 10px; width: 40%; font-weight: 600; }
        .yt-input-text { margin-bottom: 10px; width: 100%; }
        .yt-form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px; }
        .yt-btn-cancel { background: transparent; border: none; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 20px; transition: background 0.2s; }
        .yt-btn-cancel:hover { background: #f2f2f2; }
        .yt-btn-submit { background: #065fd4; color: white; border: none; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 20px; transition: background 0.2s; }
        .yt-btn-submit:hover { background: #0056b3; }
        .yt-btn-submit:disabled { background: #cccccc; color: #999; cursor: not-allowed; }
        .yt-comment-item { display: flex; gap: 15px; margin-bottom: 25px; }
        .yt-avatar { width: 40px; height: 40px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; flex-shrink: 0; }
        .yt-comment-content { display: flex; flex-direction: column; width: 100%; }
        .yt-comment-header { margin-bottom: 4px; }
        .yt-comment-name { font-weight: 700; font-size: 13px; color: #0f0f0f; margin-right: 5px; }
        .yt-comment-time { font-size: 12px; color: #606060; }
        .yt-comment-text { font-size: 14px; color: #0f0f0f; line-height: 1.5; margin-bottom: 8px; }
        .no-comments { font-size: 14px; color: #606060; text-align: center; padding: 20px 0; }
        @media (max-width: 768px) { .comments-wrapper { padding: 20px; } .yt-input-name { width: 100%; } }

/* ======================== FOOTER ======================== */
        .footer { background-color: #ffffff; color: #333; width: 100%; }
        .footer-top { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 50px 20px; }
        .footer-logo img { width: 70px; height: auto; object-fit: contain; }
        .footer-contact { text-align: left; }
        .footer-contact h4 { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #111; }
        .footer-contact ul { list-style: none; padding: 0; }
        .footer-contact li { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 10px; color: #333; font-weight: 500; }
        .icon-svg-small { width: 18px; height: 18px; fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-bottom { border-top: 1px solid #e0e0e0; text-align: center; padding: 20px; }
        .footer-bottom p { font-size: 13px; color: #555; font-weight: 500; }
        @media (max-width: 768px) { .footer-top { flex-direction: column; gap: 30px; text-align: center; } .footer-contact { text-align: center; } .footer-contact li { justify-content: center; } }
    </style>
</head>

    <!-- Script Animasi, Love & Comment -->
    <script>
    // 1. MASUKKAN KEDUA URL DI BAWAH INI
    const SHEET_ID = '1-4uqCduqz9zaMK1jJSnqdyZLQ1YOmy_D-EjqJjA2BtI'; 
    const SHEET_TITLE = 'Sheet1'; 
    const SHEET_READ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${SHEET_TITLE}&range=A2:ZZ6&headers=0&tqx=out:json`;

    // 2. MASUKKAN URL APLIKASI WEB DARI GOOGLE APPS SCRIPT DI SINI 
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiJfxnfNzfcsglWbNEL67TDvPJYN9zcROY4XKIaaTu2hYOUYB40oYDv4V-9Qf80IR2/exec';

    // VARIABEL DEFAULT FOTO/LOGO
    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/%3E%3Ccircle cx='12' cy='7' r='4'/%3E%3C/svg%3E";

    let adviceData = [];
    let currentIndex = 0;
    let isAnimating = false;
    let isLiking = false;

    const cardElement = document.getElementById('flashcard');
    const usernameEl = document.getElementById('card-username');
    const degreeEl = document.getElementById('card-degree');
    const photoEl = document.getElementById('card-photo');
    const textEl = document.getElementById('card-text');
    const timeEl = document.getElementById('card-time');

    const loveIcon = document.getElementById('love-icon');
    const loveCountEl = document.getElementById('love-count');
    const commentCountEl = document.getElementById('comment-count');
    const commentsTitleCount = document.getElementById('comments-title-count');
    const commentsList = document.getElementById('comments-list');

    function getAvatarColor(name) {
        const colors = ['#0288D1', '#D32F2F', '#388E3C', '#7B1FA2', '#FBC02D', '#E64A19', '#1976D2', '#5D4037'];
        let charCode = (name && name.length > 0) ? name.charCodeAt(0) : 0;
        return colors[charCode % colors.length];
    }

    function renderComments(commentsArr) {
        commentsList.innerHTML = '';
        commentsTitleCount.innerText = `${commentsArr.length} Comments`;
        commentCountEl.innerText = commentsArr.length;

        if (commentsArr.length > 0) {
            commentsArr.forEach(c => {
                let formattedName = c.name.replace(/\s+/g, '').toLowerCase();
                let initial = c.name.charAt(0).toUpperCase();
                let bgColor = getAvatarColor(c.name);

                commentsList.innerHTML += `
                    <div class="yt-comment-item">
                        <div class="yt-avatar" style="background-color: ${bgColor};">${initial}</div>
                        <div class="yt-comment-content">
                            <div class="yt-comment-header">
                                <span class="yt-comment-name">@${formattedName}</span>
                                <span class="yt-comment-time">${c.time}</span>
                            </div>
                            <div class="yt-comment-text">${c.text}</div>
                        </div>
                    </div>
                `;
            });
        } else {
            commentsList.innerHTML = '<p class="no-comments">No comments yet.</p>';
        }
    }

    function updateCardContent(index) {
        if (adviceData.length === 0) return;
        const data = adviceData[index];
        
        usernameEl.innerText = data.username;
        degreeEl.innerText = data.degree;
        
        // Logika untuk menampilkan foto atau logo fallback
        photoEl.src = data.photo;
        
        // Jika link foto error / gagal dimuat, ganti pakai logo default
        photoEl.onerror = function() {
            this.onerror = null; 
            this.src = DEFAULT_AVATAR;
            this.style.padding = "8px"; // Tambah padding jika fallback aktif dari error
        };

        // Hilangkan padding jika itu foto asli, tambahkan padding jika itu ikon default dari sel kosong
        if (data.photo === DEFAULT_AVATAR) {
            photoEl.style.padding = "8px";
        } else {
            photoEl.style.padding = "0px";
        }

        textEl.innerText = data.text;
        timeEl.innerText = data.time;
        loveCountEl.innerText = data.likes || 0;
        
        loveIcon.classList.remove('liked');
        loveCountEl.classList.remove('liked');
        
        renderComments(data.comments);
    }

    async function fetchSpreadsheetData() {
        try {
            const response = await fetch(SHEET_READ_URL);
            const text = await response.text();
            
            const jsonString = text.substring(47).slice(0, -2);
            const json = JSON.parse(jsonString);

            adviceData = json.table.rows.map(row => {
                let commentsData = [];
                for (let i = 6; i < row.c.length; i++) {
                    if (row.c[i] && row.c[i].v) {
                        try {
                            let parsedComment = JSON.parse(row.c[i].v);
                            commentsData.push(parsedComment);
                        } catch(err) {
                            commentsData.push({ name: "Unknown", time: "-", text: row.c[i].v });
                        }
                    }
                }

                return {
                    username: row.c[0]?.v || "Anonymous",               
                    photo: row.c[1]?.v || DEFAULT_AVATAR, // Jika sel kosong, pakai default  
                    degree: row.c[2]?.v || "",                          
                    time: row.c[3]?.v || "Waktu tidak diketahui",       
                    text: row.c[4]?.v || "Empty advice message.",       
                    likes: row.c[5]?.v || 0,                            
                    comments: commentsData                              
                };
            });

            if (adviceData.length > 0) {
                currentIndex = Math.floor(Math.random() * adviceData.length);
                updateCardContent(currentIndex);
            }
        } catch (error) {
            console.error("Failed to fetch Spreadsheet data:", error);
        }
    }

    fetchSpreadsheetData();

    function clearCommentForm() {
        document.getElementById('comment-name').value = '';
        document.getElementById('comment-text').value = '';
    }

    async function likeCard() {
        if (isLiking || adviceData.length === 0) return;
        isLiking = true;

        loveIcon.classList.add('liked');
        loveCountEl.classList.add('liked');
        loveCountEl.innerText = '...';

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 'action': 'like', 'index': currentIndex })
            });

            const result = await response.json();
            
            if (result.success) {
                adviceData[currentIndex].likes = result.newLikes;
                loveCountEl.innerText = result.newLikes;
            } else {
                throw new Error("Failed to add like.");
            }
        } catch (error) {
            console.error("Error liking:", error);
            loveCountEl.innerText = adviceData[currentIndex].likes || 0;
            loveIcon.classList.remove('liked');
            loveCountEl.classList.remove('liked');
        } finally {
            isLiking = false;
        }
    }

    async function submitComment() {
        const nameInput = document.getElementById('comment-name');
        const textInput = document.getElementById('comment-text');
        const submitBtn = document.getElementById('submit-comment-btn');
        
        const nameValue = nameInput.value.trim();
        const textValue = textInput.value.trim();
        
        if (!nameValue || !textValue) {
            alert("Name and comment cannot be empty!");
            return;
        }

        submitBtn.innerText = 'Sending...';
        submitBtn.disabled = true;

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    'action': 'comment', 
                    'index': currentIndex,
                    'name': nameValue,
                    'text': textValue
                })
            });

            const result = await response.json();
            
            if (result.success) {
                adviceData[currentIndex].comments.push(result.comment);
                updateCardContent(currentIndex); 
                clearCommentForm();
            } else {
                throw new Error("Failed to save comment.");
            }
        } catch (error) {
            console.error("Error submitting comment:", error);
            alert("An error occurred. Failed to send comment.");
        } finally {
            submitBtn.innerText = 'Comment';
            submitBtn.disabled = false;
        }
    }

    function nextCard() {
        if (isAnimating || adviceData.length === 0) return;
        isAnimating = true;
        
        const commentsWrapper = document.getElementById('comments-wrapper');
        commentsWrapper.style.opacity = '0';
        
        cardElement.style.transform = "rotateY(-90deg)";
        
        setTimeout(() => {
            currentIndex = (currentIndex + 1) % adviceData.length;
            updateCardContent(currentIndex);
            
            cardElement.style.transition = "none";
            cardElement.style.transform = "rotateY(90deg)";
            void cardElement.offsetWidth; 
            cardElement.style.transition = "transform 0.4s ease-in-out";
            cardElement.style.transform = "rotateY(0deg)";
            commentsWrapper.style.opacity = '1';
            
            setTimeout(() => { isAnimating = false; }, 400); 
        }, 400);
    }

    function prevCard() {
        if (isAnimating || adviceData.length === 0) return;
        isAnimating = true;
        
        const commentsWrapper = document.getElementById('comments-wrapper');
        commentsWrapper.style.opacity = '0';
        
        cardElement.style.transform = "rotateY(90deg)";
        setTimeout(() => {
            currentIndex = (currentIndex - 1 + adviceData.length) % adviceData.length;
            updateCardContent(currentIndex);
            
            cardElement.style.transition = "none";
            cardElement.style.transform = "rotateY(-90deg)";
            void cardElement.offsetWidth; 
            cardElement.style.transition = "transform 0.4s ease-in-out";
            cardElement.style.transform = "rotateY(0deg)";
            commentsWrapper.style.opacity = '1';
            
            setTimeout(() => { isAnimating = false; }, 400);
        }, 400);
    }
    </script>
