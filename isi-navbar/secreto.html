<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secreto Arsyatera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
/* ======================== GENERAL SETTING & NAVBAR ======================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: white; font-family: 'Montserrat', sans-serif; overflow-x: hidden; padding-top: 50px; }
        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }
        
        /* NAVBAR UTAMA (Atas) */
        .navbar { 
            background-color: #D0D0D0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 1000; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            transition: 0.4s ease;
        }
        
        .navbar-container { 
            width: 100%; 
            max-width: 1200px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 5px 40px; 
        }
        
        .logo-navbar img { 
            height: 35px; 
            max-width: 100%; 
            object-fit: contain; 
        }

        /* TOMBOL HAMBURGER */
        .hamburger {
            background: none;
            border: none;
            padding: 2px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: transform 0.3s ease;
        }

        .hamburger:hover {
            transform: scale(1.05);
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: #5a0815;
            border-radius: 3px;
            transition: 0.3s;
        }

        @media (max-width: 768px) { 
            .navbar-container { padding: 5px 25px; } 
        }

/* ======================== SIDEBAR MENU ======================== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100vh;
            background-color: #D0D0D0;
            z-index: 1002;
            padding: 40px 30px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo-sidebar img {
            height: 35px;
            object-fit: contain;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 35px;
            color: #5a0815;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #A3162B;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            list-style: none;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #5a0815;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            transition: color 0.3s ease, padding-left 0.3s ease;
        }

        .nav-links a:hover {
            color: #A3162B;
            padding-left: 10px;
        }

        @media (max-width: 576px) {
            .sidebar {
                width: 100%;
                right: -100%;
            }
        }

/* ======================== SECRETO (CAROUSEL & CARD) ======================== */
        .secreto-section { background: linear-gradient(135deg, #5a0815, #3a040d); width: 100%; min-height: calc(100vh - 65px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; flex-direction: column; }
        .secreto-container { width: 100%; max-width: 900px; text-align: center; }
        .secreto-title { color: white; font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700; letter-spacing: 2px; line-height: 1.1; margin-bottom: 15px; }
        .secreto-subtitle { color: rgba(255, 255, 255, 0.9); font-size: 16px; margin-bottom: 50px; font-family: 'Montserrat', sans-serif; }
        .secreto-carousel-wrapper { display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 10; }
        
        .nav-btn { background: transparent; border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; flex-shrink: 0; outline: none; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: white; transform: scale(1.1); }
        .nav-btn svg { width: 24px; height: 24px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .secreto-flip-container { perspective: 1200px; width: 100%; max-width: 700px; z-index: 10; }
        .secreto-card { background: white; border-radius: 15px; padding: 30px; text-align: left; box-shadow: 0 15px 40px rgba(0,0,0,0.3); margin: 0 auto; transform-style: preserve-3d; transition: transform 0.4s ease-in-out; width: 100%; }
        
        .secreto-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .secreto-user { display: flex; align-items: center; gap: 12px; }
        .secreto-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #111; display: flex; justify-content: center; align-items: center; }
        .secreto-username { font-family: 'Montserrat', sans-serif; font-weight: 700; color: #111; font-size: 16px; }
        
        .secreto-body p { font-family: 'Montserrat', sans-serif; font-size: 15px; color: #222; line-height: 1.6; margin-bottom: 30px; min-height: 80px; }
        
        .secreto-actions { display: flex; gap: 20px; align-items: center; }
        
        .action-item { display: flex; align-items: center; gap: 5px; cursor: pointer; transition: transform 0.2s; }
        .action-item:hover { transform: scale(1.05); }
        .action-item:hover .icon-svg { stroke: #A3162B; }
        .action-count { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600; color: #555; transition: color 0.2s; }
        
        .icon-svg.liked { fill: #A3162B; stroke: #A3162B; }
        .action-count.liked { color: #A3162B; }
        .icon-svg { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; transition: stroke 0.2s, fill 0.2s; }
        .icon-svg:hover { stroke: #A3162B; }

        @media (max-width: 768px) { .secreto-title { font-size: 36px; } .secreto-card { padding: 25px; } .secreto-carousel-wrapper { gap: 10px; } .nav-btn { width: 35px; height: 35px; } .nav-btn svg { width: 18px; height: 18px; } }

/* ======================== COMMENTS SECTION (YOUTUBE STYLE) ======================== */
        .comments-wrapper {
            width: 100%;
            max-width: 700px;
            margin: 20px auto 0;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: left;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .yt-comments-count {
            font-size: 18px;
            font-weight: 700;
            color: #0f0f0f;
            margin-bottom: 25px;
        }

        /* --- Input Form Style --- */
        .yt-comment-form {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
        }
        
        .yt-avatar-self {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        
        .yt-avatar-self svg {
            width: 22px;
            height: 22px;
            stroke: #606060;
            fill: none;
            stroke-width: 2;
        }
        
        .yt-form-right {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .yt-input {
            border: none;
            border-bottom: 1px solid #e5e5e5;
            padding: 5px 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
            background: transparent;
            transition: border-color 0.2s;
        }
        
        .yt-input:focus { border-bottom: 2px solid #0f0f0f; }
        .yt-input-name { margin-bottom: 10px; width: 40%; font-weight: 600; }
        .yt-input-text { margin-bottom: 10px; width: 100%; }
        
        .yt-form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }
        
        .yt-btn-cancel {
            background: transparent;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .yt-btn-cancel:hover { background: #f2f2f2; }
        
        .yt-btn-submit {
            background: #065fd4;
            color: white;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .yt-btn-submit:hover { background: #0056b3; }
        .yt-btn-submit:disabled { background: #cccccc; color: #999; cursor: not-allowed; }

        /* --- Display Comments Style --- */
        .yt-comment-item {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .yt-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .yt-comment-content {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .yt-comment-header {
            margin-bottom: 4px;
        }

        .yt-comment-name {
            font-weight: 700;
            font-size: 13px;
            color: #0f0f0f;
            margin-right: 5px;
        }

        .yt-comment-time {
            font-size: 12px;
            color: #606060;
        }

        .yt-comment-text {
            font-size: 14px;
            color: #0f0f0f;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .no-comments {
            font-size: 14px;
            color: #606060;
            text-align: center;
            padding: 20px 0;
        }

        @media (max-width: 768px) { 
            .comments-wrapper { padding: 20px; } 
            .yt-input-name { width: 100%; }
        }

/* ======================== FOOTER ======================== */
        .footer { background-color: #ffffff; color: #333; width: 100%; }
        .footer-top { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 50px 20px; }
        .footer-logo img { width: 70px; height: auto; object-fit: contain; }
        .footer-contact { text-align: left; }
        .footer-contact h4 { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #111; }
        .footer-contact ul { list-style: none; padding: 0; }
        .footer-contact li { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 10px; color: #333; font-weight: 500; }
        .icon-svg-small { width: 18px; height: 18px; fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-bottom { border-top: 1px solid #e0e0e0; text-align: center; padding: 20px; }
        .footer-bottom p { font-size: 13px; color: #555; font-weight: 500; }
        @media (max-width: 768px) { .footer-top { flex-direction: column; gap: 30px; text-align: center; } .footer-contact { text-align: center; } .footer-contact li { justify-content: center; } }
    </style>
</head>

    <!-- Script Animasi, Love & Comment -->
    <script>
    // ======================= LOGIKA SIDEBAR =======================
    const hamburgerBtn = document.getElementById("hamburgerBtn");
    const sidebar = document.getElementById("sidebar");
    const closeBtn = document.getElementById("closeBtn");
    const overlay = document.getElementById("overlay");

    function toggleSidebar() {
        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");
    }

    hamburgerBtn.addEventListener("click", toggleSidebar);
    closeBtn.addEventListener("click", toggleSidebar);
    overlay.addEventListener("click", toggleSidebar);


    // ======================= LOGIKA DATA GOOGLE SHEETS =======================
    // 1. MASUKKAN KEDUA URL DI BAWAH INI
    const SHEET_ID = '1HbSs-7CrhP3_I9NfF8QJtOkQOaQyHGTtKxwieKr6QpE'; 
    const SHEET_TITLE = 'Sheet1'; 
    const SHEET_READ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${SHEET_TITLE}&range=A2:ZZ177&headers=0&tqx=out:json`;
    
    // 2. MASUKKAN URL APLIKASI WEB DARI GOOGLE APPS SCRIPT DI SINI 
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyjSaAV9uNfZ-wjsZpsXmhT7j-9KYNaQHoQdxQpgEuRfVvWce7eOJ4FaEYJJGG2mZjIIg/exec';

    let secretoData = [];
    let currentIndex = 0;
    let isAnimating = false;
    let isLiking = false;

    const cardElement = document.getElementById('flashcard');
    const usernameEl = document.getElementById('card-username');
    const textEl = document.getElementById('card-text');
    
    const loveIcon = document.getElementById('love-icon');
    const loveCountEl = document.getElementById('love-count');
    const commentCountEl = document.getElementById('comment-count');
    const commentsTitleCount = document.getElementById('comments-title-count');
    const commentsList = document.getElementById('comments-list');

    // Helper: Mendapatkan warna solid acak berdasarkan huruf awal nama
    function getAvatarColor(name) {
        const colors = ['#0288D1', '#D32F2F', '#388E3C', '#7B1FA2', '#FBC02D', '#E64A19', '#1976D2', '#5D4037'];
        let charCode = (name && name.length > 0) ? name.charCodeAt(0) : 0;
        return colors[charCode % colors.length];
    }

    // Fungsi Render Tampilan Komentar bergaya YouTube
    function renderComments(commentsArr) {
        commentsList.innerHTML = '';
        commentsTitleCount.innerText = `${commentsArr.length} Comments`;
        commentCountEl.innerText = commentsArr.length;

        if (commentsArr.length > 0) {
            commentsArr.forEach(c => {
                let formattedName = c.name.replace(/\s+/g, '').toLowerCase();
                let initial = c.name.charAt(0).toUpperCase();
                let bgColor = getAvatarColor(c.name);

                commentsList.innerHTML += `
                    <div class="yt-comment-item">
                        <div class="yt-avatar" style="background-color: ${bgColor};">${initial}</div>
                        <div class="yt-comment-content">
                            <div class="yt-comment-header">
                                <span class="yt-comment-name">@${formattedName}</span>
                                <span class="yt-comment-time">${c.time}</span>
                            </div>
                            <div class="yt-comment-text">${c.text}</div>
                        </div>
                    </div>
                `;
            });
        } else {
            commentsList.innerHTML = '<p class="no-comments">No comments yet.</p>';
        }
    }

    // Fungsi Update Konten Kartu Utama
    function updateCardContent(index) {
        if (secretoData.length === 0) return;
        usernameEl.innerText = secretoData[index].username;
        textEl.innerText = secretoData[index].text;
        
        loveCountEl.innerText = secretoData[index].likes || 0;
        
        loveIcon.classList.remove('liked');
        loveCountEl.classList.remove('liked');
        
        renderComments(secretoData[index].comments);
    }

    // MENGAMBIL DATA DARI SPREADSHEET (Read)
    async function fetchSpreadsheetData() {
        try {
            const response = await fetch(SHEET_READ_URL);
            const text = await response.text();
            
            const jsonString = text.substring(47).slice(0, -2);
            const json = JSON.parse(jsonString);

            secretoData = json.table.rows.map(row => {
                let commentsData = [];
                for (let i = 4; i < row.c.length; i++) {
                    if (row.c[i] && row.c[i].v) {
                        try {
                            let parsedComment = JSON.parse(row.c[i].v);
                            commentsData.push(parsedComment);
                        } catch(err) {
                            commentsData.push({ name: "Unknown", time: "-", text: row.c[i].v });
                        }
                    }
                }

                return {
                    username: row.c[0]?.v || "Anonymous",
                    text: row.c[1]?.v || "Empty secret message.",
                    likes: row.c[3]?.v || 0,
                    comments: commentsData
                };
            });

            if (secretoData.length > 0) {
                currentIndex = Math.floor(Math.random() * secretoData.length);
                updateCardContent(currentIndex);
            }
        } catch (error) {
            console.error("Failed to fetch Spreadsheet data:", error);
        }
    }

    fetchSpreadsheetData();

    function clearCommentForm() {
        document.getElementById('comment-name').value = '';
        document.getElementById('comment-text').value = '';
    }

    // FUNGSI UNTUK MENEKAN TOMBOL LOVE (Write)
    async function likeCard() {
        if (isLiking || secretoData.length === 0) return;
        isLiking = true;

        loveIcon.classList.add('liked');
        loveCountEl.classList.add('liked');
        loveCountEl.innerText = '...';

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 'action': 'like', 'index': currentIndex })
            });

            const result = await response.json();
            
            if (result.success) {
                secretoData[currentIndex].likes = result.newLikes;
                loveCountEl.innerText = result.newLikes;
            } else {
                throw new Error("Failed to add like.");
            }
        } catch (error) {
            console.error("Error liking:", error);
            loveCountEl.innerText = secretoData[currentIndex].likes || 0;
            loveIcon.classList.remove('liked');
            loveCountEl.classList.remove('liked');
        } finally {
            isLiking = false;
        }
    }

    // FUNGSI UNTUK SUBMIT KOMENTAR BARU (Write)
    async function submitComment() {
        const nameInput = document.getElementById('comment-name');
        const textInput = document.getElementById('comment-text');
        const submitBtn = document.getElementById('submit-comment-btn');
        
        const nameValue = nameInput.value.trim();
        const textValue = textInput.value.trim();
        
        if (!nameValue || !textValue) {
            alert("Name and comment cannot be empty!");
            return;
        }

        submitBtn.innerText = 'Sending...';
        submitBtn.disabled = true;

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    'action': 'comment', 
                    'index': currentIndex,
                    'name': nameValue,
                    'text': textValue
                })
            });

            const result = await response.json();
            
            if (result.success) {
                secretoData[currentIndex].comments.push(result.comment);
                updateCardContent(currentIndex); 
                clearCommentForm();
            } else {
                throw new Error("Failed to save comment.");
            }
        } catch (error) {
            console.error("Error submitting comment:", error);
            alert("An error occurred. Failed to send comment.");
        } finally {
            submitBtn.innerText = 'Comment';
            submitBtn.disabled = false;
        }
    }

    // ANIMASI NEXT & BACK
    function nextCard() {
        if (isAnimating || secretoData.length === 0) return;
        isAnimating = true;
        
        const commentsWrapper = document.getElementById('comments-wrapper');
        commentsWrapper.style.opacity = '0';
        
        cardElement.style.transform = "rotateY(-90deg)";
        
        setTimeout(() => {
            currentIndex = (currentIndex + 1) % secretoData.length;
            updateCardContent(currentIndex);
            
            cardElement.style.transition = "none";
            cardElement.style.transform = "rotateY(90deg)";
            void cardElement.offsetWidth; 
            cardElement.style.transition = "transform 0.4s ease-in-out";
            cardElement.style.transform = "rotateY(0deg)";
            commentsWrapper.style.opacity = '1';
            
            setTimeout(() => { isAnimating = false; }, 400); 
        }, 400);
    }

    function prevCard() {
        if (isAnimating || secretoData.length === 0) return;
        isAnimating = true;
        
        const commentsWrapper = document.getElementById('comments-wrapper');
        commentsWrapper.style.opacity = '0';
        
        cardElement.style.transform = "rotateY(90deg)";
        setTimeout(() => {
            currentIndex = (currentIndex - 1 + secretoData.length) % secretoData.length;
            updateCardContent(currentIndex);
            
            cardElement.style.transition = "none";
            cardElement.style.transform = "rotateY(-90deg)";
            void cardElement.offsetWidth; 
            cardElement.style.transition = "transform 0.4s ease-in-out";
            cardElement.style.transform = "rotateY(0deg)";
            commentsWrapper.style.opacity = '1';
            
            setTimeout(() => { isAnimating = false; }, 400);
        }, 400);
    }
    </script>
