<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Arsyatera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
/* ======================== GENERAL SETTING ======================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: white;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            padding-top: 50px; /* Ruang untuk navbar fixed */
        }
        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }

/* ======================== NAVBAR ======================== */
        .navbar {
            background-color: #D0D0D0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            height: 50px;
        }
        .navbar-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo-navbar img { height: 45px; max-width: 100%; object-fit: contain; }
        .nav-links { display: flex; list-style: none; gap: 45px; margin: 0; padding: 0; }
        .nav-links a {
            text-decoration: none;
            color: #5a0815;
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            font-weight: 700;
            transition: color 0.3s ease;
        }
        .nav-links a:hover { color: #A3162B; }

        @media (max-width: 768px) {
            .fl-grid { grid-template-columns: 1fr; gap: 50px; }
            .fl-colors { gap: 40px; flex-direction: column; align-items: center; }
        }
        @media (max-width: 576px) {
            .navbar-container { flex-direction: column; gap: 15px; padding: 15px 20px; }
            body { padding-top: 110px; }
        }

/* ======================== CONTACT SECTION ======================== */
        .contact-section {
            /* Background merah maroon persis seperti gambar */
            background: linear-gradient(180deg, #7c1426, #4a0914);
            width: 100%;
            min-height: calc(100vh - 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px 80px 20px;
        }

        .contact-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .contact-title {
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 50px;
        }

        .contact-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: left;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            margin: 0 auto;
        }

        .form-title {
            font-family: 'Playfair Display', serif;
            color: #1a4f48; /* Hijau gelap / Teal */
            font-size: 28px;
            margin-bottom: 25px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .form-group label {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #1a4f48; /* Hijau gelap / Teal */
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            font-family: 'Montserrat', sans-serif;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #8c152c;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            background-color: #8c152c; /* Merah maroon */
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            padding: 14px;
            margin-top: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #6a0f21;
        }

        @media (max-width: 576px) {
            .contact-title { font-size: 34px; }
            .form-row { flex-direction: column; gap: 18px; }
            .contact-card { padding: 25px; }
        }

/* ======================== FOOTER ======================== */
        .footer { background-color: #ffffff; color: #333; width: 100%; }
        .footer-top {
            max-width: 800px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; padding: 50px 20px;
        }
        .footer-logo img { width: 70px; height: auto; object-fit: contain; }
        .footer-contact { text-align: left; }
        .footer-contact h4 { font-size: 14px; font-weight: 700; margin-bottom: 15px; color: #111; }
        .footer-contact ul { list-style: none; padding: 0; }
        .footer-contact li { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 10px; color: #333; font-weight: 500; }
        .icon-svg-small { width: 16px; height: 16px; fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-bottom { border-top: 1px solid #e0e0e0; text-align: center; padding: 15px; }
        .footer-bottom p { font-size: 12px; color: #888; font-weight: 500; }

        @media (max-width: 768px) {
            .footer-top { flex-direction: column; gap: 30px; text-align: center; }
            .footer-contact { text-align: center; }
            .footer-contact li { justify-content: center; }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="logo-navbar">
                <img src="../Arsyatera.svg" alt="Logo Navbar" onerror="this.onerror=null; this.src='https://placehold.co/100x40?text=Logo&bg=white'">
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="secreto.html">Secreto</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contact Us Section -->
    <section class="contact-section">
        <div class="contact-container">
            <h2 class="contact-title">Contact Us</h2>
            
            <div class="contact-card">
                <h3 class="form-title">Send us a message</h3>
                
                <form class="contact-form" name="contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn btn-kirim">Send</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-top">
            <div class="footer-logo">
                <img src="../Logo Pure.svg" alt="Logo Arsyatera Footer" onerror="this.onerror=null; this.src='https://placehold.co/100?text=Logo&bg=white'">
            </div>
            <div class="footer-contact">
                <h4>Find Us</h4>
                <ul>
                    <li>
                        <svg class="icon-svg-small" viewBox="0 0 24 24">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                        @arsyatera
                    </li>
                    <li>
                        <svg class="icon-svg-small" viewBox="0 0 24 24">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        arsyatera@gmail.com
                    </li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Copyright © 2026 ARSYATERA - All right reserved</p>
        </div>
    </footer>
    <script>
        // Ganti dengan URL Web App Apps Script yang Anda dapatkan
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyjpe4Ws_4BotHNlEe_OkEyGwHuYOGGEsyDHpmL9-l-_MAxFcrdTF0SLGGO4yftuB4QWw/exec';
        const form = document.forms['contact-form'];
        const btnKirim = document.querySelector('.btn-kirim');
    
        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Ubah teks tombol saat proses pengiriman
            const originalText = btnKirim.innerHTML;
            btnKirim.innerHTML = 'Sending...';
            btnKirim.disabled = true;
    
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    // Berhasil
                    btnKirim.innerHTML = originalText;
                    btnKirim.disabled = false;
                    alert('Success! Your message has been sent.');
                    form.reset(); // Kosongkan form setelah terkirim
                })
                .catch(error => {
                    // Gagal
                    btnKirim.innerHTML = originalText;
                    btnKirim.disabled = false;
                    alert('Error! Message failed to send.');
                    console.error('Error!', error.message);
                });
        });
    </script>
</body>
</html>
