<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Arsyatera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
/* ======================== GENERAL SETTING ======================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: white;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            padding-top: 50px; /* Ruang untuk navbar fixed */
        }
        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }

/* ======================== NAVBAR ======================== */
        .navbar {
            background-color: #D0D0D0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            height: 50px;
        }
        .navbar-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo-navbar img { height: 45px; max-width: 100%; object-fit: contain; }
        .nav-links { display: flex; list-style: none; gap: 45px; margin: 0; padding: 0; }
        .nav-links a {
            text-decoration: none;
            color: #5a0815;
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            font-weight: 700;
            transition: color 0.3s ease;
        }
        .nav-links a:hover { color: #A3162B; }

        @media (max-width: 768px) {
            .fl-grid { grid-template-columns: 1fr; gap: 50px; }
            .fl-colors { gap: 40px; flex-direction: column; align-items: center; }
        }

/* ======================== GALLERY BANNER ======================== */
        .gallery-section {
            background: linear-gradient(135deg, #8B182A, #5a0815);
            width: 100%;
            min-height: calc(100vh - 50px); 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .gallery-title {
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 2px;
        }

        .gallery-subtitle {
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .gallery-title { font-size: 40px; }
            .gallery-section { min-height: calc(50vh - 110px); }
        }

/* ======================== GALLERY GRID (MASONRY) ======================== */
        .gallery-container-white {
            background-color: white;
            border-radius: 30px 30px 0 0;
            padding: 50px 20px;
            width: 100%;
            margin-top: -30px; 
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .photo-grid {
            max-width: 1000px;
            margin: 0 auto;
            column-count: 4; 
            column-gap: 15px;
            padding-bottom: 40px;
        }

        .photo-item {
            background-color: #d9d9d9;
            border-radius: 12px;
            border: 1px solid #777;
            margin-bottom: 15px;
            break-inside: avoid;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .photo-item:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .h-small { height: 120px; }
        .h-medium { height: 200px; }
        .h-large { height: 280px; }

        .gallery-btn {
            background-color: #8B1E3F;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 40px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 5px 15px rgba(139, 30, 63, 0.3);
        }

        .gallery-btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        @media (max-width: 900px) { .photo-grid { column-count: 3; } }
        @media (max-width: 600px) {
            .photo-grid { column-count: 2; }
            .gallery-container-white { border-radius: 20px 20px 0 0; padding: 40px 15px; }
        }

/* ======================== POPUP LIGHTBOX ======================== */
        .modal-lightbox {
            display: none; 
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            overflow: hidden;
            touch-action: none; 
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90vw;
            max-height: 90vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: grab; 
        }

        .modal-content:active {
            cursor: grabbing; 
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 45px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 10000;
        }

        .close-btn:hover, .close-btn:focus {
            color: #A3162B;
            text-decoration: none;
            cursor: pointer;
        }

        .zoom-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            pointer-events: none;
        }

/* ======================== FOOTER ======================== */
        .footer { 
            background-color: #ffffff; 
            color: #333; 
            width: 100%; 
            position: relative; /* Ditambahkan */
            z-index: 15; /* Ditambahkan agar footer ada di atas container putih */
            box-shadow: 0 -25px 40px -10px rgba(0, 0, 0, 0.15); /* Ditambahkan untuk efek gradasi ke atas */
        }
        .footer-top {
            max-width: 800px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; padding: 50px 20px;
        }
        .footer-logo img { width: 70px; height: auto; object-fit: contain; }
        .footer-contact { text-align: left; }
        .footer-contact h4 { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #111; }
        .footer-contact ul { list-style: none; padding: 0; }
        .footer-contact li { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 10px; color: #333; font-weight: 500; }
        .icon-svg-small { width: 18px; height: 18px; fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-bottom { border-top: 1px solid #e0e0e0; text-align: center; padding: 20px; }
        .footer-bottom p { font-size: 13px; color: #555; font-weight: 500; }

        @media (max-width: 768px) {
            .footer-top { flex-direction: column; gap: 30px; text-align: center; }
            .footer-contact { text-align: center; }
            .footer-contact li { justify-content: center; }
        }
    </style>
</head>

    <!-- POPUP LIGHTBOX CONTAINER -->
    <div id="lightboxModal" class="modal-lightbox">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="lightboxImg">
        <div class="zoom-hint">Geser & Tekan '+' / '-' atau cubit untuk Zoom</div>
    </div>

    <!-- LOGIKA JAVASCRIPT UNTUK POPUP, ZOOM, DAN DRAG -->
    <script>
        const modal = document.getElementById("lightboxModal");
        const modalImg = document.getElementById("lightboxImg");
        const closeBtn = document.querySelector(".close-btn");
        const photoItems = document.querySelectorAll(".photo-item");

        // Variabel untuk Zoom & Pan (Geser)
        let currentScale = 1;
        let currentX = 0;
        let currentY = 0;

        let isDragging = false;
        let startX = 0;
        let startY = 0;

        let isPinching = false;
        let startDistance = 0;
        let startScale = 1;

        // 1. Munculkan pop-up saat foto di-tap
        photoItems.forEach(item => {
            item.addEventListener("click", function() {
                modal.style.display = "block";
                
                // Ambil gambar di dalam kotak
                const img = this.querySelector("img");
                if (img) {
                    modalImg.src = img.src;
                } else {
                    modalImg.src = "https://placehold.co/800x1000?text=Preview+Foto&bg=333&textColor=fff";
                }
                
                resetTransform();
            });
        });

        // 2. Fungsi Menutup Modal
        function closeModal() {
            modal.style.display = "none";
            resetTransform();
        }

        // 3. Tekan tanda silang (X)
        closeBtn.addEventListener("click", closeModal);

        // 4. Tekan layar di luar area foto
        modal.addEventListener("click", function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        // ================== FUNGSI UTAMA ZOOM & GESER ==================
        function resetTransform() {
            currentScale = 1;
            currentX = 0;
            currentY = 0;
            applyTransform(false);
        }

        // smooth = true untuk zoom via scroll/keyboard, false saat sedang di-drag
        function applyTransform(smooth = false) {
            if (smooth) {
                modalImg.style.transition = "transform 0.2s ease-out";
            } else {
                modalImg.style.transition = "none";
            }
            // Menerapkan skala dan posisi X, Y secara bersamaan
            modalImg.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px)) scale(${currentScale})`;
        }

        // ================== DRAG MENGGUNAKAN MOUSE (DESKTOP) ==================
        modalImg.addEventListener("mousedown", (e) => {
            e.preventDefault(); // Mencegah bawaan drag browser
            isDragging = true;
            // Catat selisih awal antara posisi mouse dan posisi gambar
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
        });

        window.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            applyTransform(false); // Tanpa smooth transisi agar instan mengikuti mouse
        });

        window.addEventListener("mouseup", () => {
            isDragging = false;
        });

        // ================== ZOOM MENGGUNAKAN KEYBOARD (+ / -) ==================
        document.addEventListener("keydown", function(e) {
            if (modal.style.display === "block") {
                if (e.key === "Escape") {
                    closeModal();
                } else if (e.key === "+" || e.key === "=") {
                    currentScale = Math.min(currentScale + 0.2, 5); // Max zoom 5x
                    applyTransform(true);
                } else if (e.key === "-") {
                    currentScale = Math.max(currentScale - 0.2, 0.5); // Min zoom 0.5x
                    applyTransform(true);
                }
            }
        });

        // ================== GESTUR LAYAR SENTUH (PAN & PINCH) ==================
        modalImg.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                // Satu jari -> Pan (Geser)
                isDragging = true;
                startX = e.touches[0].clientX - currentX;
                startY = e.touches[0].clientY - currentY;
            } else if (e.touches.length === 2) {
                // Dua jari -> Pinch (Zoom)
                isPinching = true;
                isDragging = false;
                startDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                startScale = currentScale;
            }
        }, { passive: false });

        modalImg.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Mencegah layar website ketarik saat digeser
            if (e.touches.length === 1 && isDragging) {
                // Proses Pan
                currentX = e.touches[0].clientX - startX;
                currentY = e.touches[0].clientY - startY;
                applyTransform(false);
            } else if (e.touches.length === 2 && isPinching) {
                // Proses Zoom
                const currentDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                const scaleModifier = currentDistance / startDistance;
                currentScale = Math.max(0.5, Math.min(startScale * scaleModifier, 5));
                applyTransform(false);
            }
        }, { passive: false });

        modalImg.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                isPinching = false;
            }
            if (e.touches.length === 0) {
                isDragging = false;
            }
        });

        // ================== ZOOM PAKAI RODA MOUSE (SCROLL) ==================
        modal.addEventListener("wheel", (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                currentScale = Math.min(currentScale + 0.1, 5); // Scroll atas untuk Zoom In
            } else {
                currentScale = Math.max(currentScale - 0.1, 0.5); // Scroll bawah untuk Zoom Out
            }
            applyTransform(true); // Pakai transisi smooth
        }, { passive: false });
    </script>
