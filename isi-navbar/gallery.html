<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Arsyatera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
/* ======================== GENERAL SETTING ======================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: white;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            padding-top: 50px; /* Ruang untuk navbar fixed */
        }
        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }

/* ======================== NAVBAR ======================== */
        .navbar {
            background-color: #D0D0D0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .navbar-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-navbar img { height: 45px; max-width: 100%; object-fit: contain; }
        .nav-links { display: flex; list-style: none; gap: 45px; margin: 0; padding: 0; }
        .nav-links a {
            text-decoration: none;
            color: #5a0815;
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            font-weight: 700;
            transition: color 0.3s ease;
        }
        .nav-links a:hover { color: #A3162B; }

        @media (max-width: 768px) {
            .navbar-container { padding: 10px 25px; }
            .nav-links { gap: 20px; }
            .nav-links a { font-size: 15px; }
        }
        @media (max-width: 576px) {
            .navbar-container { flex-direction: column; gap: 15px; padding: 15px 20px; }
            body { padding-top: 110px; }
        }

/* ======================== GALLERY ======================== */
        .gallery-section {
            background: linear-gradient(135deg, #8B182A, #5a0815);
            width: 100%;
            /* Dikurangi sedikit height-nya karena ada padding-top di body */
            min-height: calc(100vh - 50px); 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .gallery-title {
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .gallery-title { font-size: 40px; }
            .gallery-section { min-height: calc(50vh - 110px); }
        }

/* ======================== FOOTER ======================== */
        .footer { background-color: #ffffff; color: #333; width: 100%; }
        .footer-top {
            max-width: 800px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; padding: 50px 20px;
        }
        .footer-logo img { width: 70px; height: auto; object-fit: contain; }
        .footer-contact { text-align: left; }
        .footer-contact h4 { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #111; }
        .footer-contact ul { list-style: none; padding: 0; }
        .footer-contact li { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 10px; color: #333; font-weight: 500; }
        .icon-svg-small { width: 18px; height: 18px; fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-bottom { border-top: 1px solid #e0e0e0; text-align: center; padding: 20px; }
        .footer-bottom p { font-size: 13px; color: #555; font-weight: 500; }

        @media (max-width: 768px) {
            .footer-top { flex-direction: column; gap: 30px; text-align: center; }
            .footer-contact { text-align: center; }
            .footer-contact li { justify-content: center; }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="logo-navbar">
                <img src="../Arsyatera.svg" alt="Logo Navbar" onerror="this.onerror=null; this.src='https://placehold.co/100x40?text=Logo&bg=white'">
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="secreto.html">Contact</a></li>
            </ul>
        </div>
    </nav>
    <section class="gallery-section">
        <h2 class="gallery-title">Arsyatera's<br>Gallery</h2>
    </section>
    <footer class="footer">
        <div class="footer-top">
            <div class="footer-logo">
                <img src="../Logo Pure.svg" alt="Logo Arsyatera Footer" onerror="this.onerror=null; this.src='https://placehold.co/100?text=Logo&bg=white'">
            </div>
            <div class="footer-contact">
                <h4>Find Us</h4>
                <ul>
                    <li>
                        <svg class="icon-svg-small" viewBox="0 0 24 24">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                        @arsyatera
                    </li>
                    <li>
                        <svg class="icon-svg-small" viewBox="0 0 24 24">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        arsyatera@gmail.com
                    </li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Copyright © 2026 ARSYATERA - All right reserved</p>
        </div>
    </footer>
    </body>
</html>
